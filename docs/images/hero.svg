<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <linearGradient id="av1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="av2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="av3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1a1a24" stroke-width="1">
    <path d="M0 125 H1200 M0 250 H1200 M0 375 H1200"/>
    <path d="M200 0 V500 M400 0 V500 M600 0 V500 M800 0 V500 M1000 0 V500"/>
  </g>

  <!-- Launcher window (center) -->
  <g transform="translate(400,80)" filter="url(#shadow)">
    <rect width="400" height="340" rx="14" fill="#0f0f14" stroke="#222230" stroke-width="1"/>
    <!-- title bar -->
    <rect width="400" height="32" rx="14" fill="#141420"/>
    <rect y="18" width="400" height="14" fill="#141420"/>
    <rect x="12" y="10" width="14" height="14" rx="3" fill="url(#av1)"/>
    <text x="34" y="21" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="11">Claude Launcher</text>
    <circle cx="378" cy="16" r="3" fill="#71717a"/>
    <circle cx="368" cy="16" r="3" fill="#71717a"/>
    <!-- header -->
    <text x="20" y="66" fill="#fafafa" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">Claude Accounts</text>
    <text x="20" y="84" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="11">Launch any account side-by-side.</text>
    <text x="360" y="72" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="end">3 of 3 live</text>

    <!-- Card 1 -->
    <rect x="16" y="100" width="368" height="68" rx="10" fill="#15151e" stroke="#ef4444" stroke-width="1.5"/>
    <circle cx="48" cy="134" r="20" fill="url(#av3)"/>
    <text x="48" y="139" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AA</text>
    <rect x="62" y="150" width="14" height="12" rx="3" fill="#0a0a0f" stroke="#3f3f46"/>
    <text x="69" y="159" fill="#a1a1aa" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">1</text>
    <text x="80" y="124" fill="#fafafa" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Account A</text>
    <rect x="152" y="113" width="52" height="14" rx="7" fill="#ef4444"/>
    <text x="178" y="123" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MAX 20X</text>
    <text x="80" y="138" fill="#a1a1aa" font-family="Segoe UI, sans-serif" font-size="10">user-a@example.com</text>
    <circle cx="86" cy="154" r="3" fill="#22c55e" filter="url(#glow)"/>
    <text x="94" y="158" fill="#22c55e" font-family="Segoe UI, sans-serif" font-size="9">Running  3 processes  ·  1.4 GB · up 18m</text>
    <rect x="294" y="118" width="80" height="26" rx="6" fill="#ef4444"/>
    <text x="334" y="135" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ New window</text>

    <!-- Card 2 -->
    <rect x="16" y="178" width="368" height="68" rx="10" fill="#15151e" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="48" cy="212" r="20" fill="url(#av2)"/>
    <text x="48" y="217" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">AB</text>
    <rect x="62" y="228" width="14" height="12" rx="3" fill="#0a0a0f" stroke="#3f3f46"/>
    <text x="69" y="237" fill="#a1a1aa" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">2</text>
    <text x="80" y="202" fill="#fafafa" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">Account B</text>
    <rect x="152" y="191" width="44" height="14" rx="7" fill="#3b82f6"/>
    <text x="174" y="201" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" text-anchor="middle">MAX 5X</text>
    <text x="80" y="216" fill="#a1a1aa" font-family="Segoe UI, sans-serif" font-size="10">user-b@example.com</text>
    <circle cx="86" cy="232" r="3" fill="#22c55e" filter="url(#glow)"/>
    <text x="94" y="236" fill="#22c55e" font-family="Segoe UI, sans-serif" font-size="9">Running  2 processes  ·  980 MB · up 54m</text>
    <rect x="294" y="196" width="80" height="26" rx="6" fill="#3b82f6"/>
    <text x="334" y="213" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="middle">+ New window</text>

    <!-- Card 3 -->
    <rect x="16" y="256" width="368" height="68" rx="10" fill="#141420" stroke="#1f1f23" stroke-width="1"/>
    <circle cx="48" cy="290" r="20" fill="url(#av1)"/>
    <text x="48" y="295" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle">MC</text>
    <rect x="62" y="306" width="14" height="12" rx="3" fill="#0a0a0f" stroke="#3f3f46"/>
    <text x="69" y="315" fill="#a1a1aa" font-family="Consolas, monospace" font-size="9" font-weight="700" text-anchor="middle">3</text>
    <text x="80" y="280" fill="#fafafa" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600">MCP Dev</text>
    <rect x="148" y="269" width="36" height="14" rx="7" fill="#8b5cf6"/>
    <text x="166" y="279" fill="#fff" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" text-anchor="middle">PRO</text>
    <text x="80" y="294" fill="#a1a1aa" font-family="Segoe UI, sans-serif" font-size="10">user-c@example.com</text>
    <circle cx="86" cy="310" r="3" fill="#3f3f46"/>
    <text x="94" y="314" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="9">Not running</text>
    <rect x="294" y="274" width="80" height="26" rx="6" fill="#8b5cf6"/>
    <text x="334" y="291" fill="#fff" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Launch</text>
  </g>

  <!-- Side arrow decorations -->
  <g opacity="0.3">
    <path d="M60 240 L380 240" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
    <path d="M820 240 L1140 240" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  </g>

  <!-- Left Claude window silhouette -->
  <g transform="translate(60,100)" opacity="0.72">
    <rect width="300" height="300" rx="10" fill="#1a1a24" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="300" height="24" rx="10" fill="#15151e"/>
    <rect y="14" width="300" height="10" fill="#15151e"/>
    <text x="150" y="16" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Claude — Account A</text>
    <rect x="16" y="48" width="80" height="240" fill="#13131c"/>
    <rect x="22" y="64" width="68" height="10" rx="2" fill="#2a2a38"/>
    <rect x="22" y="80" width="56" height="10" rx="2" fill="#1f1f2a"/>
    <rect x="22" y="96" width="60" height="10" rx="2" fill="#1f1f2a"/>
    <rect x="22" y="112" width="48" height="10" rx="2" fill="#1f1f2a"/>
    <circle cx="200" cy="140" r="38" fill="url(#av3)" opacity="0.4"/>
    <text x="200" y="146" fill="#ef4444" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Chat 1</text>
    <rect x="112" y="200" width="172" height="12" rx="2" fill="#2a2a38"/>
    <rect x="112" y="220" width="140" height="12" rx="2" fill="#2a2a38"/>
    <rect x="112" y="240" width="160" height="12" rx="2" fill="#2a2a38"/>
  </g>

  <!-- Right Claude window silhouette -->
  <g transform="translate(840,100)" opacity="0.72">
    <rect width="300" height="300" rx="10" fill="#1a1a24" stroke="#3b82f6" stroke-width="1.5"/>
    <rect width="300" height="24" rx="10" fill="#15151e"/>
    <rect y="14" width="300" height="10" fill="#15151e"/>
    <text x="150" y="16" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="9" text-anchor="middle">Claude — Account B</text>
    <rect x="16" y="48" width="80" height="240" fill="#13131c"/>
    <rect x="22" y="64" width="64" height="10" rx="2" fill="#2a2a38"/>
    <rect x="22" y="80" width="68" height="10" rx="2" fill="#1f1f2a"/>
    <rect x="22" y="96" width="50" height="10" rx="2" fill="#1f1f2a"/>
    <rect x="22" y="112" width="58" height="10" rx="2" fill="#1f1f2a"/>
    <circle cx="200" cy="140" r="38" fill="url(#av2)" opacity="0.4"/>
    <text x="200" y="146" fill="#3b82f6" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Chat 2</text>
    <rect x="112" y="200" width="160" height="12" rx="2" fill="#2a2a38"/>
    <rect x="112" y="220" width="172" height="12" rx="2" fill="#2a2a38"/>
    <rect x="112" y="240" width="150" height="12" rx="2" fill="#2a2a38"/>
  </g>

  <!-- Caption -->
  <text x="600" y="462" fill="#71717a" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">
    Two Claude Desktop accounts, one keypress away. Not a mockup — ship it to your taskbar.
  </text>
</svg>
