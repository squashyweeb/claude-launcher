# gitleaks custom config for claude-launcher
# Catches Anthropic-shaped bearer tokens plus the usual suspects.

title = "claude-launcher gitleaks policy"

[[rules]]
id = "anthropic-oauth-access-token"
description = "Anthropic OAuth access token (sk-ant-oat01-...)"
regex = '''sk-ant-oat01-[A-Za-z0-9_-]{40,}'''
tags = ["key", "anthropic", "oauth", "critical"]
secretGroup = 0

[[rules]]
id = "anthropic-oauth-refresh-token"
description = "Anthropic OAuth refresh token (sk-ant-ort01-...)"
regex = '''sk-ant-ort01-[A-Za-z0-9_-]{40,}'''
tags = ["key", "anthropic", "oauth", "critical"]
secretGroup = 0

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-api03-...)"
regex = '''sk-ant-api03-[A-Za-z0-9_-]{40,}'''
tags = ["key", "anthropic", "api", "critical"]
secretGroup = 0

[[rules]]
id = "generic-aws-access-key"
description = "AWS Access Key ID"
regex = '''(?i)(AKIA|ASIA)[0-9A-Z]{16}'''
tags = ["key", "aws"]

[[rules]]
id = "generic-github-token"
description = "GitHub token (classic + fine-grained)"
regex = '''(?i)gh[pousr]_[A-Za-z0-9]{36,}'''
tags = ["key", "github"]

[[rules]]
id = "private-key-block"
description = "PEM-style private key header"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH |)PRIVATE KEY-----'''
tags = ["key", "pem"]

[allowlist]
description = "Documentation placeholders + example files"
paths = [
  '''profiles\.example\.json$''',
  '''prefs\.example\.json$''',
  '''config\.example\.json$''',
  '''\.gitleaks\.toml$''',
  '''docs/.*\.md$''',
  '''scripts/check-pii\.(sh|ps1|js)$''',
]
regexes = [
  '''sk-ant-(oat01|ort01|api03)-<REDACTED>''',
  '''sk-ant-(oat01|ort01|api03)-\.{3}''',
  '''00000000-0000-0000-0000-00000000000[0-9a-f]''',
]
