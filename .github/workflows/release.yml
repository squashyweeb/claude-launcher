name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: node scripts/check-pii.js
      - run: npm run pack
      - name: Zip + checksum
        shell: pwsh
        run: |
          $src = "dist/ClaudeLauncher-win32-x64"
          $out = "ClaudeLauncher-${{ github.ref_name }}-win32-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $out -Force
          $h = (Get-FileHash $out -Algorithm SHA256).Hash
          "$h  $out" | Out-File -FilePath "$out.sha256" -Encoding ASCII
          Write-Host "Built $out ($h)"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ClaudeLauncher-${{ github.ref_name }}-win32-x64.zip
            ClaudeLauncher-${{ github.ref_name }}-win32-x64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
