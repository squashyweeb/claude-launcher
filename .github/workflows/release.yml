name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install
        run: npm ci

      - name: PII sentinel scan
        run: node scripts/check-pii.js

      - name: Build portable .exe
        run: npm run pack
        env:
          # electron-builder respects this; prevents the auto-publish path.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate build output + checksum
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'ClaudeLauncher-*.exe' | Select-Object -First 1
          if (-not $exe) { throw "No ClaudeLauncher-*.exe in dist/" }
          $out = $exe.FullName
          $h = (Get-FileHash $out -Algorithm SHA256).Hash
          $sum = "$out.sha256"
          "$h  $($exe.Name)" | Out-File -FilePath $sum -Encoding ASCII
          "exe=$out"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sum=$sum"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "size=$([math]::Round($exe.Length / 1MB, 1)) MB" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Built $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB, SHA256 $h)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.exe }}
            ${{ steps.artifact.outputs.sum }}
          body: |
            ## Download

            - **Portable (recommended):** `ClaudeLauncher-${{ github.ref_name }}.exe` — single file, ${{ steps.artifact.outputs.size }}, no installer. Double-click to run.
            - `*.sha256` — checksum for verification.

            Windows SmartScreen may warn on first run (unsigned OSS). Click **More info → Run anyway**. See [#7](https://github.com/squashyweeb/claude-launcher/issues/7) for the code-signing plan.

            ## What's in this release

            Changelog is auto-generated below from the commit history on this tag.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
